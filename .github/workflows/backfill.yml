name: Backfill US10Y History

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date YYYY-MM-DD (inclusive)"
        required: true
        default: "2026-05-13"
      end:
        description: "End date YYYY-MM-DD (inclusive)"
        required: true
        default: "2026-05-19"

permissions:
  contents: write

# Serialize with the daily update so the two never race each other's push.
concurrency:
  group: us10y-data-write
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run backfill
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/backfill.py --start "${{ inputs.start }}" --end "${{ inputs.end }}"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -z "$(git status --porcelain data.json)" ]]; then
            echo "No changes to commit"
            exit 0
          fi
          git add data.json
          git commit -m "chore: backfill ${{ inputs.start }} → ${{ inputs.end }}"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "✓ Pushed backfill (attempt ${attempt})"
              exit 0
            fi
            echo "Push rejected; rebasing onto latest (attempt ${attempt})"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase -X theirs "origin/${GITHUB_REF_NAME}" || git rebase --abort
            sleep $((attempt * 2))
          done
          echo "✗ Push failed after retries"
          exit 1
