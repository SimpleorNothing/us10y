name: Backfill US10Y History

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start date YYYY-MM-DD (inclusive)"
        required: true
        default: "2026-05-13"
      end:
        description: "End date YYYY-MM-DD (inclusive)"
        required: true
        default: "2026-05-19"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run backfill
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/backfill.py --start "${{ inputs.start }}" --end "${{ inputs.end }}"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data.json)" ]]; then
            git add data.json
            git commit -m "chore: backfill ${{ inputs.start }} → ${{ inputs.end }}"
            git push
            echo "✓ Pushed backfill"
          else
            echo "No changes to commit"
          fi
