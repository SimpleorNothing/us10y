name: Daily US10Y Update

on:
  schedule:
    # Morning run. KST 06:13 = UTC 21:13. Minute offset from :00 is deliberate
    # — GitHub drops/delays top-of-hour cron under peak load, so an off-hour
    # minute is far more reliable. US market closes ~UTC 20:00-21:00, so the
    # close is fresh.
    - cron: "13 21 * * *"
    # Backup runs: GitHub silently drops scheduled cron under load, so a
    # single daily trigger regularly misses. These retries land the update
    # if the primary was dropped. update.py skips re-calling the API when
    # today's snapshot already exists, so backups are free no-ops once the
    # day is done.
    - cron: "40 22 * * *" # KST 07:40
    - cron: "30 23 * * *" # KST 08:30
    # Evening run. KST 18:50 = UTC 09:50, an intraday refresh during the
    # KST evening so the tracker updates twice daily.
    - cron: "50 9 * * *"
  workflow_dispatch: # Allow manual trigger from Actions tab
    inputs:
      force:
        description: "Re-run even if today's snapshot already exists"
        type: boolean
        default: true

permissions:
  contents: write

# Serialize with any other workflow that writes data.json (e.g. backfill)
# so two runs never race each other's push.
concurrency:
  group: us10y-data-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run daily update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORCE_UPDATE: ${{ inputs.force }}
        run: python scripts/update.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -z "$(git status --porcelain data.json)" ]]; then
            echo "No changes to commit"
            exit 0
          fi
          git add data.json
          git commit -m "chore: daily update $(TZ=Asia/Seoul date +%Y-%m-%d)"
          # Push with rebase-retry: if the remote advanced while we ran, replay
          # our data.json on top (preferring our fresh values) and retry.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "✓ Pushed update (attempt ${attempt})"
              exit 0
            fi
            echo "Push rejected; rebasing onto latest (attempt ${attempt})"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase -X theirs "origin/${GITHUB_REF_NAME}" || git rebase --abort
            sleep $((attempt * 2))
          done
          echo "✗ Push failed after retries"
          exit 1
