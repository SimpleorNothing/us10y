name: Daily US10Y Update

on:
  schedule:
    # KST 06:50 = UTC 21:50. Minute offset from :00 is deliberate — GitHub
    # drops/delays top-of-hour cron under peak load, so :50 is far more
    # reliable. US market closes ~UTC 20:00-21:00, so the close is fresh.
    - cron: "50 21 * * *"
  workflow_dispatch: # Allow manual trigger from Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run daily update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data.json)" ]]; then
            git add data.json
            git commit -m "chore: daily update $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
            echo "✓ Pushed update"
          else
            echo "No changes to commit"
          fi
