name: Daily US10Y Update

on:
  schedule:
    # Twice daily. Minute offset from :00 is deliberate — GitHub drops/delays
    # top-of-hour cron under peak load, so :50 is far more reliable.
    # KST 06:50 = UTC 21:50 (prev day). US market closes ~UTC 20:00-21:00, so
    # the close is fresh for the morning run.
    - cron: "50 21 * * *"
    # KST 18:50 = UTC 09:50, an intraday refresh during the KST evening.
    - cron: "50 9 * * *"
  workflow_dispatch: # Allow manual trigger from Actions tab

permissions:
  contents: write

# Serialize with any other workflow that writes data.json (e.g. backfill)
# so two runs never race each other's push.
concurrency:
  group: us10y-data-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run daily update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -z "$(git status --porcelain data.json)" ]]; then
            echo "No changes to commit"
            exit 0
          fi
          git add data.json
          git commit -m "chore: daily update $(TZ=Asia/Seoul date +%Y-%m-%d)"
          # Push with rebase-retry: if the remote advanced while we ran, replay
          # our data.json on top (preferring our fresh values) and retry.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "✓ Pushed update (attempt ${attempt})"
              exit 0
            fi
            echo "Push rejected; rebasing onto latest (attempt ${attempt})"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase -X theirs "origin/${GITHUB_REF_NAME}" || git rebase --abort
            sleep $((attempt * 2))
          done
          echo "✗ Push failed after retries"
          exit 1
