<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>US 10Y Treasury Yield Tracker</title>
<meta name="description" content="미국 10년 국채금리 연말 시나리오 확률 일별 추적">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="container">

  <header class="header">
    <div class="header-title">
      <h1>US 10Y Treasury</h1>
      <p class="subtitle">연말 시나리오 확률 추적</p>
    </div>
    <div class="header-meta">
      <span class="badge" id="last-updated">—</span>
    </div>
  </header>

  <section class="metrics" id="metrics">
    <div class="metric-card">
      <div class="metric-label">10Y</div>
      <div class="metric-value" id="m-10y">—</div>
      <div class="metric-delta" id="d-10y"></div>
    </div>
    <div class="metric-card">
      <div class="metric-label">30Y</div>
      <div class="metric-value" id="m-30y">—</div>
      <div class="metric-delta" id="d-30y"></div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Brent</div>
      <div class="metric-value" id="m-brent">—</div>
      <div class="metric-delta" id="d-brent"></div>
    </div>
    <div class="metric-card">
      <div class="metric-label">WTI</div>
      <div class="metric-value" id="m-wti">—</div>
      <div class="metric-delta" id="d-wti"></div>
    </div>
  </section>

  <section class="probability-summary">
    <div class="prob-row">
      <div class="prob-cell bull">
        <div class="prob-label">Bull <span class="prob-range">3.75–4.0%</span></div>
        <div class="prob-value" id="p-bull">—%</div>
      </div>
      <div class="prob-cell base">
        <div class="prob-label">Base <span class="prob-range">4.3–4.6%</span></div>
        <div class="prob-value" id="p-base">—%</div>
      </div>
      <div class="prob-cell bear">
        <div class="prob-label">Bear <span class="prob-range">5.0%+</span></div>
        <div class="prob-value" id="p-bear">—%</div>
      </div>
    </div>
  </section>

  <section class="chart-section">
    <h2>확률 추이</h2>
    <div class="chart-wrapper">
      <canvas id="trendChart" role="img" aria-label="시나리오 확률 일별 추이"></canvas>
    </div>
  </section>

  <section class="daily-feed" id="daily-feed"></section>

  <footer class="footer">
    <p class="disclaimer">본 분석은 의사결정 지원용이며, 매수/매도 권유가 아닙니다.</p>
    <p class="source">데이터: yfinance (^TNX, ^TYX, BZ=F, CL=F) · 분석: Claude API</p>
  </footer>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="app.js"></script>

</body>
</html>
